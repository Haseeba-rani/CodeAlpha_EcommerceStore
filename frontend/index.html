<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hapyshop - Home</title>
    <meta name="description" content="Modern Creative E-commerce Store">
    
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #6366f1; /* Indigo */
            --secondary-color: #1e1b4b; /* Deep Navy */
            --accent-color: #ec4899; /* Pink */
        }
    }

    @layer base {
        body {
            @apply bg-white text-slate-800 font-sans;
        }
    }

    @layer components {
        .btn-primary {
            @apply bg-[var(--primary-color)] text-white px-6 py-2 rounded-md font-medium hover:bg-blue-700 transition-colors duration-300;
        }
        .btn-secondary {
            @apply bg-[var(--secondary-color)] text-white px-6 py-2 rounded-md font-medium hover:bg-slate-800 transition-colors duration-300;
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <!-- Shared Components -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-init.js"></script>
    <script src="demo-backend.js"></script>
    <script src="api.js"></script>
    <script type="text/babel" src="components/Navbar.js"></script>
    <script type="text/babel" src="components/Footer.js"></script>
    <script type="text/babel" src="components/ProductCard.js"></script>
    <!-- App Entry -->
    <script type="text/babel" src="app.js"></script>
</body>
</html>
